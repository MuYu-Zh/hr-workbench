name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本（用于手动触发，默认读 package.json）'
        required: false

jobs:
  build-windows:
    name: Windows 安装包 (x64)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Windows 安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm run pack:win *> build-win.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-win.log -Tail 80 -Encoding UTF8 | ForEach-Object {
              $escaped = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error file=.github/workflows/build-desktop.yml,line=35::$escaped"
            }
            exit $code
          }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-workbench-windows-build-log
          path: build-win.log
          if-no-files-found: ignore

      - name: 上传产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: hr-workbench-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true

  build-macos:
    name: macOS 安装包 (x64 + arm64)
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 macOS 安装包（Intel + Apple Silicon）
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run pack:mac > build-mac.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -n 80 build-mac.log | while IFS= read -r line; do
              line=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error file=.github/workflows/build-desktop.yml,line=94::$line"
            done
            exit $code
          fi

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-workbench-macos-build-log
          path: build-mac.log
          if-no-files-found: ignore

      - name: 上传产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: hr-workbench-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          generate_release_notes: true
